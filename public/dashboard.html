<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ERLC Staff Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="topbar">

        <div>
            <strong>ERLC STAFF</strong>
        </div>

        <div class="user-area">

            <span id="username">
                Loading...
            </span>

            <a href="/logout" class="logout">
                Logout
            </a>

        </div>

    </header>

    <main class="dashboard">

        <h1>Staff Dashboard</h1>

        <p class="subtitle">
            Manage your staff activity.
        </p>

        <!-- SHIFT -->

        <section class="card">

            <h2>Shift Management</h2>

            <p id="shiftStatus">
                Checking shift status...
            </p>

            <div class="button-row">

                <button
                    id="startShift"
                    onclick="startShift()"
                >
                    🟢 Start Shift
                </button>

                <button
                    id="endShift"
                    onclick="endShift()"
                    class="danger"
                >
                    🔴 End Shift
                </button>

            </div>

        </section>

        <!-- LOA -->

        <section class="card">

            <h2>Request LOA</h2>

            <form id="loaForm">

                <label>
                    Reason
                </label>

                <textarea
                    id="loaReason"
                    placeholder="Reason for your LOA..."
                    required
                ></textarea>

                <label>
                    Start Date
                </label>

                <input
                    type="date"
                    id="loaStart"
                    required
                >

                <label>
                    End Date
                </label>

                <input
                    type="date"
                    id="loaEnd"
                    required
                >

                <button type="submit">
                    Submit LOA
                </button>

            </form>

        </section>

        <!-- SUPERVISOR -->

        <section
            class="card"
            id="supervisorSection"
            style="display:none;"
        >

            <h2>Supervisor Panel</h2>

            <div id="loaRequests">
                Loading LOA requests...
            </div>

        </section>

        <!-- PUNISHMENT -->

        <section class="card">

            <h2>Log Punishment</h2>

            <form id="punishmentForm">

                <label>
                    Discord User ID
                </label>

                <input
                    id="punishmentUserId"
                    placeholder="123456789012345678"
                    required
                >

                <label>
                    Username
                </label>

                <input
                    id="punishmentUsername"
                    placeholder="Username"
                    required
                >

                <label>
                    Punishment Type
                </label>

                <select id="punishmentType">

                    <option value="Warning">
                        Warning
                    </option>

                    <option value="Strike">
                        Strike
                    </option>

                    <option value="Suspension">
                        Suspension
                    </option>

                    <option value="Termination">
                        Termination
                    </option>

                </select>

                <label>
                    Reason
                </label>

                <textarea
                    id="punishmentReason"
                    placeholder="Reason..."
                    required
                ></textarea>

                <button type="submit">
                    Log Punishment
                </button>

            </form>

        </section>

        <!-- MANAGEMENT -->

        <section
            class="card"
            id="managementSection"
            style="display:none;"
        >

            <h2>Management Punishment Records</h2>

            <div id="punishmentHistory">
                Loading...
            </div>

        </section>

    </main>

    <script src="dashboard.js"></script>

</body>

</html>
